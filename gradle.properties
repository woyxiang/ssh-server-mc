# Mod 属性
mod_id=sshserver
mod_version=0.1.2
mod_group=io.github.woyxiang

# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.caching=true

# 网络防卡死：被 DNS 污染的仓库（maven.neoforged.net 曾被解析到不可达 IP）
# 必须在 5 秒内失败换源或报错，禁止无限 SYN 挂起
systemProp.org.gradle.internal.http.connectionTimeout=5000
systemProp.org.gradle.internal.http.socketTimeout=20000
systemProp.org.gradle.internal.http.retryCount=2
